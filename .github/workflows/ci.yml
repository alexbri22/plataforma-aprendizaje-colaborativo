name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      # apps/api/src/routes/cuentas.test.ts corre contra Postgres real
      # (DATABASE_URL_TEST), separado de la base de desarrollo — ver
      # apps/api/scripts/migrar-bd-pruebas.mjs.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plataforma
          POSTGRES_PASSWORD: plataforma
          POSTGRES_DB: plataforma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plataforma -d plataforma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://plataforma:plataforma@localhost:5432/plataforma_test
      # En local estas viven en apps/api/.env (ver .env.example); el CI no
      # tiene ese archivo. Sin la primera, las pruebas de integración, que
      # registran una cuenta por caso, chocan con el límite de producción
      # (20 por ventana) y reciben 429 sin cookie de sesión. Sin la segunda,
      # el endpoint de la tarea programada rechaza toda petición. Ninguna es
      # un secreto real: solo se usan bajo Vitest.
      RATE_LIMIT_REGISTRO_MAX_TEST: '300'
      CRON_SECRET: secreto-solo-para-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Pruebas
        run: npm run test
